[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocean-research-hub"
version = "0.1.0"
description = "Evidence-backed scientific paper records"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pypdf>=5.0,<7",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_research_hub"]

[project.scripts]
ocean-research-hub = "ocean_research_hub.__main__:main"
ocean-research-hub-benchmark = "ocean_research_hub.evaluation.__main__:main"
ocean-research-hub-import-corpus = "ocean_research_hub.corpus.cli:main"
