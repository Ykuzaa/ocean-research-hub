[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocean-research-hub"
version = "0.1.0"
description = "Evidence-backed scientific paper records"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40,<1",
    "fastapi>=0.115,<1",
    "google-genai>=1.0,<2",
    "httpx>=0.28,<1",
    "pypdf>=5.0,<7",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ocean_research_hub"]

[project.scripts]
ocean-research-hub = "ocean_research_hub.__main__:main"
ocean-research-hub-benchmark = "ocean_research_hub.evaluation.__main__:main"
ocean-research-hub-real-pdf-benchmark = "ocean_research_hub.evaluation.real_pdf:main"
ocean-research-hub-seed = "ocean_research_hub.corpus.__main__:main"
